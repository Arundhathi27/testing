<!DOCTYPE html>
<html>
<head>
    <title>Edit Todo</title>
</head>
<body>
    <h1>Edit Todo</h1>
    <form method="POST">
        <input type="text"
               name="title"
               value="{{ todo['title'] }}"
               required>
        <button type="submit">
            Update Todo
        </button>
    </form>
    <br>
    <a href="{{ url_for('index') }}">
        Back to Todo List
    </a>
</body>
</html>
