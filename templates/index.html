<!DOCTYPE html>
<html>
<head>
    <title>Task Master</title>
</head>
<body>
    <h1>Task Master</h1>
    {% if todos %}
        {% for todo in todos %}
            <div>
                <form method="POST"
                      action="{{ url_for('complete_todo', id=todo['id']) }}">
                    <input type="checkbox"
                           onchange="this.form.submit()"
                           {% if todo['completed'] %}checked{% endif %}>
                    {% if todo['completed'] %}
                        <s>{{ todo['title'] }}</s>
                    {% else %}
                        {{ todo['title'] }}
                    {% endif %}
                </form>
                <p>
                    Added: {{ todo['created_at'][:10] }}
                </p>
                <a href="{{ url_for('edit_todo', id=todo['id']) }}">
                    Edit
                </a>
                &nbsp;&nbsp;&nbsp;
                <a href="{{ url_for('delete_todo', id=todo['id']) }}">
                    Delete
                </a>
            </div>
            <br>
        {% endfor %}
    {% else %}
        <p>You have no tasks. Create one below!</p>
    {% endif %}
    <h3>Add a New Task</h3>
    <form method="POST"
          action="{{ url_for('add_todo') }}">
        <input type="text"
               name="title"
               placeholder="Enter your task"
               required>
        <button type="submit">
            Add Task
        </button>
    </form>
</body>
</html>
